<!-- Trimmed from a YouTube watch page (2026). Description "Show transcript" section + the
     searchable-transcript engagement panel. Real rows are rendered after the button is clicked;
     here they are present up front. -->
<ytd-watch-metadata class="style-scope ytd-watch-flexy">
  <div id="description" class="item style-scope ytd-watch-metadata">
    <ytd-text-inline-expander id="description-inline-expander" class="style-scope ytd-watch-metadata">
      <ytd-structured-description-content-renderer class="style-scope ytd-text-inline-expander">
        <div id="items" class="style-scope ytd-structured-description-content-renderer">
          <ytd-video-description-transcript-section-renderer class="style-scope ytd-structured-description-content-renderer">
            <div id="header" class="style-scope ytd-video-description-transcript-section-renderer">
              <yt-formatted-string class="style-scope ytd-video-description-transcript-section-renderer">Transcript</yt-formatted-string>
            </div>
            <div id="primary-button" class="style-scope ytd-video-description-transcript-section-renderer">
              <ytd-button-renderer class="style-scope ytd-video-description-transcript-section-renderer" button-renderer="">
                <yt-button-shape>
                  <button class="yt-spec-button-shape-next yt-spec-button-shape-next--outline yt-spec-button-shape-next--call-to-action yt-spec-button-shape-next--size-m" aria-label="Show transcript" title="">
                    <div class="yt-spec-button-shape-next__button-text-content"><span class="yt-core-attributed-string yt-core-attributed-string--white-space-no-wrap" role="text">Show transcript</span></div>
                  </button>
                </yt-button-shape>
              </ytd-button-renderer>
            </div>
          </ytd-video-description-transcript-section-renderer>
        </div>
      </ytd-structured-description-content-renderer>
    </ytd-text-inline-expander>
  </div>
</ytd-watch-metadata>

<div id="panels" class="style-scope ytd-watch-flexy">
  <ytd-engagement-panel-section-list-renderer class="style-scope ytd-watch-flexy" target-id="engagement-panel-searchable-transcript" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN">
    <div id="header" class="style-scope ytd-engagement-panel-section-list-renderer">
      <ytd-engagement-panel-title-header-renderer class="style-scope ytd-engagement-panel-section-list-renderer">
        <div id="title-container" class="style-scope ytd-engagement-panel-title-header-renderer">
          <h2 id="title" class="style-scope ytd-engagement-panel-title-header-renderer">
            <yt-formatted-string id="title-text" class="style-scope ytd-engagement-panel-title-header-renderer">Transcript</yt-formatted-string>
          </h2>
        </div>
        <div id="visibility-button" class="style-scope ytd-engagement-panel-title-header-renderer">
          <ytd-button-renderer class="style-scope ytd-engagement-panel-title-header-renderer">
            <yt-button-shape>
              <button class="yt-spec-button-shape-next yt-spec-button-shape-next--text yt-spec-button-shape-next--icon-only-default" aria-label="Close transcript" title=""></button>
            </yt-button-shape>
          </ytd-button-renderer>
        </div>
      </ytd-engagement-panel-title-header-renderer>
    </div>
    <div id="content" class="style-scope ytd-engagement-panel-section-list-renderer">
      <ytd-transcript-renderer class="style-scope ytd-engagement-panel-section-list-renderer">
        <div id="body" class="style-scope ytd-transcript-renderer">
          <ytd-transcript-search-panel-renderer class="style-scope ytd-transcript-renderer">
            <div id="body" class="style-scope ytd-transcript-search-panel-renderer">
              <ytd-transcript-segment-list-renderer class="style-scope ytd-transcript-search-panel-renderer">
                <div id="segments-container" class="style-scope ytd-transcript-segment-list-renderer">
                  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer" rounded-container="">
                    <div class="segment style-scope ytd-transcript-segment-renderer" role="button" tabindex="0" aria-label="0 seconds Welcome back to the course">
                      <div class="segment-start-offset style-scope ytd-transcript-segment-renderer" tabindex="-1" aria-hidden="true">
                        <div class="segment-timestamp style-scope ytd-transcript-segment-renderer">
                          0:00
                        </div>
                      </div>
                      <dom-if class="style-scope ytd-transcript-segment-renderer"><template is="dom-if"></template></dom-if>
                      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer" split-lines="">Welcome back to the course</yt-formatted-string>
                    </div>
                  </ytd-transcript-segment-renderer>
                  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer" rounded-container="">
                    <div class="segment style-scope ytd-transcript-segment-renderer" role="button" tabindex="0" aria-label="4 seconds today we look at gradients">
                      <div class="segment-start-offset style-scope ytd-transcript-segment-renderer" tabindex="-1" aria-hidden="true">
                        <div class="segment-timestamp style-scope ytd-transcript-segment-renderer">
                          0:04
                        </div>
                      </div>
                      <dom-if class="style-scope ytd-transcript-segment-renderer"><template is="dom-if"></template></dom-if>
                      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer" split-lines="">today we look at
gradients</yt-formatted-string>
                    </div>
                  </ytd-transcript-segment-renderer>
                  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer" rounded-container="">
                    <div class="segment style-scope ytd-transcript-segment-renderer" role="button" tabindex="0" aria-label="[Music]">
                      <div class="segment-start-offset style-scope ytd-transcript-segment-renderer" tabindex="-1" aria-hidden="true">
                        <div class="segment-timestamp style-scope ytd-transcript-segment-renderer">
                          12:30
                        </div>
                      </div>
                      <dom-if class="style-scope ytd-transcript-segment-renderer"><template is="dom-if"></template></dom-if>
                      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer" split-lines="">[Music]</yt-formatted-string>
                    </div>
                  </ytd-transcript-segment-renderer>
                  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer" rounded-container="">
                    <div class="segment style-scope ytd-transcript-segment-renderer" role="button" tabindex="0" aria-label="1 hour, 2 minutes, 3 seconds and that&#39;s the chain rule">
                      <div class="segment-start-offset style-scope ytd-transcript-segment-renderer" tabindex="-1" aria-hidden="true">
                        <div class="segment-timestamp style-scope ytd-transcript-segment-renderer">
                          1:02:03
                        </div>
                      </div>
                      <dom-if class="style-scope ytd-transcript-segment-renderer"><template is="dom-if"></template></dom-if>
                      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer" split-lines="">and that&#39;s the chain rule</yt-formatted-string>
                    </div>
                  </ytd-transcript-segment-renderer>
                </div>
              </ytd-transcript-segment-list-renderer>
            </div>
          </ytd-transcript-search-panel-renderer>
        </div>
      </ytd-transcript-renderer>
    </div>
  </ytd-engagement-panel-section-list-renderer>
</div>
